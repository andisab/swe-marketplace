name: Validate plugin manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  drift-check:
    name: plugin.json sync and agent tool names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated plugin.json files are in sync
        run: python scripts/synthesize-plugin-manifests.py --check
      - name: Verify agents name only real tools
        run: python scripts/check-agent-tools.py

  validate-manifests:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned so a new validator check can't fail CI unannounced; bump it
      # after running ./scripts/validate-all.sh locally with the newer CLI.
      # Validation is a local check and needs no login or API key.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: Validate the catalog and every plugin
        env:
          DISABLE_AUTOUPDATER: "1"
        run: ./scripts/validate-all.sh
