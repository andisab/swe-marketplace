name: Feature request
description: Suggest an improvement to an existing plugin, agent, skill, or to the marketplace itself
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For *new plugin* proposals please use the "New plugin proposal" template instead.

  - type: dropdown
    id: target
    attributes:
      label: What would this change?
      options:
        - An existing plugin
        - The marketplace catalog or install flow
        - Tooling (manifest sync, validation, CI)
        - Docs
        - Other
    validations:
      required: true

  - type: input
    id: plugin
    attributes:
      label: Plugin name (if applicable)
      placeholder: "context-engineering"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain point are you running into? Concrete examples beat abstract requests.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Rough sketches and prompts are fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one is better.
    validations:
      required: false
