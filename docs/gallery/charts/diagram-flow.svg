<svg viewBox="0 0 1064 520" width="1064" height="520" xmlns="http://www.w3.org/2000/svg" class="cw-dg" role="img" aria-labelledby="dg-t dg-d" focusable="false" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:1064px;display:block;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="dg-t">Order platform: request and data flow</title>
  <desc id="dg-d">Architecture diagram. Web and mobile clients call the API gateway, which routes to the order service and the agent core. The order service writes to PostgreSQL and publishes to Kafka; PostgreSQL syncs embeddings to the vector store; the agent core reads the vector store and writes artifacts to object storage.</desc>
