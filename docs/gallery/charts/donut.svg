  <rect x="236" y="72" width="12" height="12" rx="2" fill="var(--cw-c1)" fill-opacity="0.78"/><text class="lgd" x="256" y="78" dy="0.32em">Storage</text><text class="pct" x="440" y="78" dy="0.32em" text-anchor="end">21%</text>
