<svg viewBox="0 0 480 260" width="480" height="260" xmlns="http://www.w3.org/2000/svg" class="cw-donut" role="img" aria-labelledby="donut-t donut-d" focusable="false" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-width:480px;display:block;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="donut-t">Cloud spend by category, Q3 2026</title>
  <desc id="donut-d">Donut chart. $3.1M total: compute 38%, storage 21%, network 14%, managed databases 12%, observability 9%, other 6%.</desc>
  <style>
    .cw-donut { --_ink:#111827; --_muted:#6B7280; --_grid:#E5E7EB; --_axis:#9CA3AF; --_bg:#FFFFFF; --_c1:#4969E1; --_c2:#8A97AD; --_neg:#C2410C; --_panel:#FFFFFF; --_border:#CBD5E1; --_edge:#94A3B8; }
    @media (prefers-color-scheme: dark) { .cw-donut { --_ink:#E6E9EF; --_muted:#9CA3AF; --_grid:#2A2F3A; --_axis:#4B5563; --_bg:#0B0E14; --_c1:#7B96F0; --_c2:#6B7686; --_neg:#F0875B; --_panel:#111A2E; --_border:#2B3A55; --_edge:#7C8DB0; } }
    .cw-donut { --cw-ink:var(--ink,var(--_ink)); --cw-muted:var(--muted,var(--_muted)); --cw-grid:var(--border,var(--_grid)); --cw-axis:var(--_axis); --cw-bg:var(--bg,var(--_bg));
              --cw-c1:var(--accent,var(--_c1)); --cw-c2:var(--_c2); --cw-neg:var(--error,var(--_neg)); --cw-panel:var(--surface,var(--_panel)); --cw-border:var(--border,var(--_border)); --cw-edge:var(--_edge); }
    .cw-donut .seg{fill:none;stroke-width:24}.cw-donut .big{fill:var(--cw-ink);font-size:28px;font-weight:700;letter-spacing:-.02em}.cw-donut .sub,.cw-donut .pct{fill:var(--cw-muted);font-size:11px}.cw-donut .lgd{fill:var(--cw-ink);font-size:12px}
  </style>
  <circle class="seg" cx="118" cy="130" r="63.66" stroke="var(--cw-c1)" stroke-opacity="1" stroke-dasharray="152 248" stroke-dashoffset="0" transform="rotate(-90 118 130)"><title>Compute — 38%</title></circle>
  <circle class="seg" cx="118" cy="130" r="63.66" stroke="var(--cw-c1)" stroke-opacity="0.78" stroke-dasharray="84 316" stroke-dashoffset="-152" transform="rotate(-90 118 130)"><title>Storage — 21%</title></circle>
  <circle class="seg" cx="118" cy="130" r="63.66" stroke="var(--cw-c1)" stroke-opacity="0.58" stroke-dasharray="56 344" stroke-dashoffset="-236" transform="rotate(-90 118 130)"><title>Network — 14%</title></circle>
