<!-- chartware SVG template: heatmap
     viewBox 600x352 · grid translate(56,44) · cell 40x34 with a 2-unit gap · rx 2
     Five DISCRETE buckets (quantile cut points: ≤2, ≤6, ≤14, ≤22, 23+), never a continuous ramp;
     one hue (the accent) at fill-opacity .08 → 1 over the canvas, so the ramp survives dark mode.
     A missing cell is an outlined rect (class na) — an absent cell would read as zero.
     In-cell values only when the cell is ≥32 units; here they're in <title> hovers instead.
     Adapt: swap the row/column labels and the bucket classes; keep the token block; rename ids per chart. -->
<svg viewBox="0 0 600 352" width="600" height="352" xmlns="http://www.w3.org/2000/svg"
     class="cw-hm" role="img" aria-labelledby="cwhm-t cwhm-d" focusable="false"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:600px;display:block;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="cwhm-t">Support tickets opened, by weekday and hour</title>
  <desc id="cwhm-d">Heatmap of ticket volume. Weekday afternoons are the peak, with 25 to 28 tickets per two-hour slot between 10:00 and 16:00 from Monday to Thursday; weekends stay under 10. Sunday 16:00 has no data.</desc>
  <style>
    /* Local defaults; flip for standalone dark mode */
    .cw-hm { --_ink:#111827; --_muted:#6B7280; --_grid:#E5E7EB; --_axis:#9CA3AF; --_bg:#FFFFFF;
              --_c1:#4969E1; --_c2:#8A97AD; --_neg:#C2410C; }
    @media (prefers-color-scheme: dark) {
      .cw-hm { --_ink:#E6E9EF; --_muted:#9CA3AF; --_grid:#2A2F3A; --_axis:#4B5563; --_bg:#0B0E14;
                --_c1:#7B96F0; --_c2:#6B7686; --_neg:#F0875B; }
    }
    /* Page tokens win when present (knowledgebase pages define --ink/--muted/--border/--bg/--accent/--error) */
    .cw-hm { --cw-ink:var(--ink,var(--_ink)); --cw-muted:var(--muted,var(--_muted));
              --cw-grid:var(--border,var(--_grid)); --cw-axis:var(--_axis); --cw-bg:var(--bg,var(--_bg));
              --cw-c1:var(--accent,var(--_c1)); --cw-c2:var(--_c2); --cw-neg:var(--error,var(--_neg)); }
    .cw-hm .rl, .cw-hm .cl, .cw-hm .lgd { fill:var(--cw-muted); font-size:11px; }
    .cw-hm .cell { fill:var(--cw-c1); stroke:none; }
    .cw-hm .q0 { fill-opacity:.08; } .cw-hm .q1 { fill-opacity:.25; } .cw-hm .q2 { fill-opacity:.45; }
    .cw-hm .q3 { fill-opacity:.7; }  .cw-hm .q4 { fill-opacity:1; }
    .cw-hm .na { fill:none; stroke:var(--cw-grid); stroke-width:1; stroke-dasharray:3 2; }
  </style>
  <!-- legend: the five buckets, lowest to highest, with the cut points -->
  <g>
    <text class="lgd" x="368" y="20" dy="0.32em" text-anchor="end">tickets ≤2</text>
    <rect class="cell q0" x="376" y="14" width="14" height="12" rx="2"><title>≤2</title></rect>
    <rect class="cell q1" x="394" y="14" width="14" height="12" rx="2"><title>3–6</title></rect>
    <rect class="cell q2" x="412" y="14" width="14" height="12" rx="2"><title>7–14</title></rect>
