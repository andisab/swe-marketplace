<!-- pattern
name: quote
title: Quote
idea: Someone else's words carry the point better than ours: a customer, a user, a source.
use: A short quote (two to three lines) and who said it; for evidence, put the source in the attribution.
avoid: Long quotes; read them in the notes and show the key phrase.
builds: none
from: Track 03 brand kit (layout-quote), old patterns.md quote
-->
<style>
section[data-key].layout-quote { justify-content: center; padding: 0 calc(var(--margin) * 2); }
section[data-key].layout-quote blockquote { max-width: 34ch; margin: 0; padding: .3em 0 .3em .9em; border-left: 4px solid var(--color-accent); font-family: var(--font-heading, var(--font-serif));
  font-size: var(--size-section); font-style: italic; line-height: 1.3; color: var(--color-ink); }
section[data-key].layout-quote .attribution { margin: 1em 0 0 1.3em; font-size: var(--size-subbody); color: var(--color-ink-muted); }
</style>
<section data-key="example-quote" class="layout-quote">
  <blockquote>The bot catches the boring things, so I can read the interesting ones.</blockquote>
  <p class="attribution">Staff engineer, payments pilot team</p>
  <aside class="notes">Read it once, slowly.</aside>
</section>
