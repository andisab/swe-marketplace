<!-- pattern
name: statement
title: Statement
idea: One sentence carries the slide; the space around it says it matters.
use: A claim, a decision or a turn in the argument the audience should remember word for word. Optional attribution or source line.
avoid: Anything that needs a second sentence to be understood.
builds: none, or the sentence's second half on a click
from: Track 03 and AI-SDLC section openers; the old patterns.md statement
-->
<style>
section[data-key].layout-statement { justify-content: center; padding: 0 calc(var(--margin) * 2); }
section[data-key].layout-statement .say { max-width: 26ch; margin: 0; font-size: var(--size-section); line-height: 1.2; color: var(--color-ink); }
section[data-key].layout-statement .say em { font-style: normal; color: var(--color-accent); }
section[data-key].layout-statement .by { margin: 1.2em 0 0; font-size: var(--size-caption); color: var(--color-ink-muted); }
</style>
<section data-key="example-statement" class="layout-statement">
  <h2 class="say">Every merge gets a second pair of eyes, and <em>one of them never sleeps</em>.</h2>
  <p class="by">The goal for 2027</p>
  <aside class="notes">Say it, pause, move on.</aside>
</section>
