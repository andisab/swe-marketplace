<!-- pattern
name: bignumber
title: Big number
idea: One number the audience should leave with, with its unit, what it measures and why it matters.
use: A headline metric, a cost, a deadline. The number in .figure, its unit in .unit, a short .label, one .context sentence; a source in the notes or a sources line.
avoid: Several numbers of equal weight (use stats); a number without a source.
builds: none, or the context on a click
from: Track 03 brand kit (layout-bignumber), old patterns.md big number
-->
<style>
section[data-key].layout-bignumber { justify-content: center; align-items: center; text-align: center; }
section[data-key].layout-bignumber .stat { min-width: 52%; padding: 36px 48px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); box-shadow: 0 2px 8px rgba(0, 0, 0, var(--shadow-opacity)); }
section[data-key].layout-bignumber .label { margin: 0 0 .6em; font-size: var(--size-caption); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--color-ink-muted); }
section[data-key].layout-bignumber .figure-row { display: flex; align-items: baseline; justify-content: center; gap: .2em; }
section[data-key].layout-bignumber .figure { font-family: var(--font-heading, var(--font-serif)); font-size: 150pt; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--color-accent); }
section[data-key].layout-bignumber .unit { font-size: var(--size-section); font-weight: 600; color: var(--color-accent); }
section[data-key].layout-bignumber .context { max-width: 46ch; margin: .8em auto 0; font-size: var(--size-body); color: var(--color-ink-body); }
</style>
<section data-key="example-bignumber" class="layout-bignumber">
  <div class="stat">
    <p class="label">Median review wait</p>
    <div class="figure-row"><span class="figure">4</span><span class="unit">hours</span></div>
    <p class="context">Down from 19 hours in the pilot teams, measured over six weeks.</p>
  </div>
  <aside class="notes">Let the number land before the context.</aside>
</section>
