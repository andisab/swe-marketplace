<!-- pattern
name: card-row
title: Cards
idea: Two to four parallel ideas of equal weight, each with a short heading and a sentence or two.
use: Options, principles, questions, components. Set --card-count to the number of cards; .top adds an accent bar, .n a number.
avoid: Five or more cards (they crowd; split the slide or use a table); items with an order (use steps).
builds: one card per click
from: Track 03 decks (layout-card-row), AI-SDLC workshop s13, s35
-->
<style>
section[data-key].layout-card-row .cards { display: grid; grid-template-columns: repeat(var(--card-count, 3), minmax(0, 1fr)); gap: var(--gap, 20px); margin-top: .8em; }
section[data-key].layout-card-row .card { position: relative; padding: 18px 18px 16px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface);
  box-shadow: 0 2px 6px rgba(0, 0, 0, var(--shadow-opacity)); overflow: hidden; overflow-wrap: anywhere; }
section[data-key].layout-card-row .card.top { border-top: 4px solid var(--color-accent); }
section[data-key].layout-card-row .card .n { display: block; margin-bottom: .5em; font-family: var(--font-mono); font-size: var(--size-caption); color: var(--color-accent); }
section[data-key].layout-card-row .card h4 { margin: 0 0 .35em; }
section[data-key].layout-card-row .card p { margin: 0; font-size: var(--size-subbody); }
</style>
<section data-key="example-card-row" class="layout-card-row" style="--card-count: 3">
  <p class="kicker">What ships</p>
  <h3>Three changes land together</h3>
  <div class="cards">
    <div class="card top" data-step="1"><span class="n">01</span><h4>Linter in CI</h4><p>Style is fixed before a person looks.</p></div>
    <div class="card top" data-step="2"><span class="n">02</span><h4>Review bot</h4><p>A first pass on every pull request.</p></div>
    <div class="card top" data-step="3"><span class="n">03</span><h4>Wait-time dashboard</h4><p>Review latency per team, every week.</p></div>
  </div>
  <aside class="notes">One sentence for the slide.

[click 1] … [click 2] … [click 3] …</aside>
</section>
