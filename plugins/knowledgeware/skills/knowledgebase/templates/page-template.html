<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} &middot; {{SITE_TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%23C15F3C%27/%3E%3Cpath%20d=%27M15.1%2010.4v13.2c-2.6-1.5-5.3-1.9-8.1-1.3V9.1c2.8-.6%205.5-.2%208.1%201.3z%27%20fill=%27%23FAF9F5%27/%3E%3Cpath%20d=%27M16.9%2010.4v13.2c2.6-1.5%205.3-1.9%208.1-1.3V9.1c-2.8-.6-5.5-.2-8.1%201.3z%27%20fill=%27%23FAF9F5%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF9F5; --panel:#F0EEE6; --panel2:#F5F3EC; --ink:#1F1E1D; --muted:#6E6A63;
  --accent:#C15F3C; --accent-dark:#9C4A2F; --border:#E3E0D7; --code-bg:#26241F; --code-ink:#EDEAE2;
  --tip:#2E7D5B; --tip-bg:#EDF5F0; --warn:#A3652A; --warn-bg:#F8F1E4; --arch:#4A5D8A; --arch-bg:#EEF1F7;
  --refs-bg:#F3F1E9; --link:#9C4A2F; --chipbg:#EBE7DB; --mark:#FBEFE9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191817; --panel:#211F1D; --panel2:#26231F; --ink:#E8E5DE; --muted:#A5A099;
    --accent:#D97757; --accent-dark:#E08B6D; --border:#3A3630; --code-bg:#121110; --code-ink:#E4E1D8;
    --tip:#7FC8A9; --tip-bg:#1C2A24; --warn:#DBA968; --warn-bg:#2C2418; --arch:#93A8D8; --arch-bg:#1E2331;
    --refs-bg:#242219; --link:#E08B6D; --chipbg:#2E2B26; --mark:#3A2A22;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{display:flex;min-height:100vh}
nav.side{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 18px 40px;font-size:13.5px}
nav.side .brand{font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.3;margin-bottom:2px}
nav.side .brand a{color:var(--ink)}
nav.side .sub{color:var(--muted);font-size:11.5px;margin-bottom:14px}
.navgroup{margin:14px 0 4px;font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.side a.pl{display:block;padding:5px 9px;border-radius:7px;color:var(--ink);margin:1px 0;line-height:1.35}
nav.side a.pl:hover{background:var(--panel2);text-decoration:none}
nav.side a.pl.active{background:var(--accent);color:#fff;font-weight:600}
main{flex:1;min-width:0}
.container{max-width:clamp(900px,86vw,1400px);margin:0 auto;padding:42px 52px 70px}
.tscroll{overflow-x:auto;margin:14px 0}
.tscroll table{margin:0}
pre.mermaid{background:transparent;border:none;color:inherit;text-align:center;padding:4px 0}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted)}
h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.18;margin:0 0 12px;letter-spacing:-.01em}
h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;margin:44px 0 12px;padding-top:14px;border-top:1px solid var(--border);letter-spacing:-.005em}
article > h2:first-child, article > section:first-child h2:first-child{border-top:none;margin-top:20px;padding-top:0}
h3{font-size:17.5px;margin:28px 0 8px}
h4{font-size:15px;margin:20px 0 6px}
p{margin:10px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{background:var(--chipbg);border:1px solid var(--border);color:var(--ink);font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px}
.chip.w{background:transparent;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 8px;border-radius:999px;vertical-align:2px;margin-left:4px}
.pill.ga{background:var(--tip-bg);color:var(--tip);border:1px solid var(--tip)}
.pill.beta{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.pill.dep{background:var(--mark);color:var(--accent-dark);border:1px solid var(--accent-dark)}
.toc{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13.5px;margin:6px 0 10px}
.toc .toctitle{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.toc ul{margin:4px 0;padding-left:18px}
.toc li{margin:2px 0}
article h2{scroll-margin-top:16px}
aside.onpage{display:none;width:250px;flex:0 0 250px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;padding:46px 24px 40px 8px;font-size:13px}
aside.onpage .toctitle{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 9px 14px}
aside.onpage ul{list-style:none;margin:0;padding:0;border-left:2px solid var(--border)}
aside.onpage li{margin:0}
aside.onpage a{display:block;padding:5px 12px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);line-height:1.4}
aside.onpage a:hover{color:var(--ink);text-decoration:none}
aside.onpage a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
@media(min-width:1200px){
  aside.onpage{display:block}
  .container .toc{display:none}
}
table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
th{background:var(--panel);text-align:left;font-size:12.5px;letter-spacing:.02em}
th,td{border:1px solid var(--border);padding:7px 10px;vertical-align:top}
tr:nth-child(even) td{background:var(--panel2)}
code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--border);padding:1px 5px;border-radius:5px}
pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.55}
pre code{background:none;border:none;color:inherit;padding:0}
.callout{border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14.5px;border:1px solid}
.callout .lab{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:4px}
.callout.tip{background:var(--tip-bg);border-color:var(--tip)}.callout.tip .lab{color:var(--tip)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn)}.callout.warn .lab{color:var(--warn)}
.callout.arch{background:var(--arch-bg);border-color:var(--arch)}.callout.arch .lab{color:var(--arch)}
.callout.refs{background:var(--refs-bg);border-color:var(--border)}.callout.refs .lab{color:var(--muted)}
.callout.refs ul{margin:4px 0 2px;padding-left:20px}
.callout.refs li{margin:3px 0}
.callout p{margin:6px 0}
ul,ol{padding-left:24px}
li{margin:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px}
.card h4{margin:2px 0 6px}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px}
.q{background:var(--panel2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:14px 18px;margin:18px 0;font-size:14.5px}
.q .qh{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:6px}
.q ol.opts{list-style:upper-alpha;margin:8px 0;padding-left:26px}
.q details{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.q summary{cursor:pointer;font-weight:600;color:var(--accent-dark)}
.pagenav{display:flex;justify-content:space-between;gap:12px;margin:48px 0 0;font-size:14px}
.pagenav a{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 16px;max-width:46%}
.pagenav .lbl{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px}
.mobilebar{display:none}
.kbd{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
@media(max-width:960px){
  nav.side{display:none}
  .mobilebar{display:block;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px;font-size:14px;position:sticky;top:0;z-index:5}
  .mobilebar summary{cursor:pointer;font-weight:600}
  .mobilebar .navgroup{margin-top:10px}
  .mobilebar a.pl{display:block;padding:6px 4px;color:var(--ink)}
  .mobilebar a.pl.active{color:var(--accent);font-weight:700}
  .container{padding:26px 20px 60px}
  .grid2{grid-template-columns:1fr}
  h1{font-size:27px}
}
@media print{
  nav.side,.mobilebar,.pagenav,.toc,aside.onpage{display:none}
  body{background:#fff;color:#000}
  .container{max-width:100%;padding:0}
  a{color:#000}
  .q details{display:block}
}
</style>
</head>
<body>
<div class="wrap">
<nav class="side">
  <div class="brand"><a href="index.html">{{SITE_TITLE}}</a></div>
  <div class="sub">{{SITE_SUBTITLE}}</div>
{{NAV_LINKS}}
</nav>
<main>
  <div class="mobilebar"><details><summary>&#9776; All topics &mdash; {{SITE_TITLE}}</summary>{{NAV_LINKS}}</details></div>
  <div class="container">
    <div class="crumb"><a href="index.html">{{SITE_TITLE}}</a> &nbsp;/&nbsp; {{CRUMB}}</div>
    <h1>{{H1}}</h1>
    <div class="chips">{{CHIPS}}</div>
    <div id="toc" class="toc"></div>
    <article>
{{CONTENT}}
    </article>
    <div class="pagenav">{{PAGENAV}}</div>
    <footer>{{FOOTER}}</footer>
  </div>
</main>
<aside class="onpage" id="onpage" aria-label="On this page"></aside>
</div>
<script>
(function(){
  var art=document.querySelector('article');if(!art)return;
  var toc=document.getElementById('toc');
  var rail=document.getElementById('onpage');
  var hs=art.querySelectorAll('h2');
  if(hs.length<2){
    if(toc)toc.style.display='none';
    if(rail)rail.style.display='none';
    return;
  }
  var html='<div class="toctitle">On this page</div><ul>';
  hs.forEach(function(h,i){
    if(!h.id){h.id='s'+(i+1)+'-'+h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,50)}
    html+='<li><a href="#'+h.id+'">'+h.textContent+'</a></li>';
  });
  html+='</ul>';
  if(toc)toc.innerHTML=html;
  if(!rail)return;
  rail.innerHTML=html;

  /* scrollspy: highlight the section currently under the reader */
  var links=rail.querySelectorAll('a');
  var current=-1;
  function keepInView(a){
    if(rail.scrollHeight<=rail.clientHeight)return;
    var top=a.offsetTop,bot=top+a.offsetHeight;
    if(top<rail.scrollTop)rail.scrollTop=top-8;
    else if(bot>rail.scrollTop+rail.clientHeight)rail.scrollTop=bot-rail.clientHeight+8;
  }
  function setActive(i){
    if(i===current)return;
    if(current>-1)links[current].classList.remove('active');
    current=i;
    if(i>-1){links[i].classList.add('active');keepInView(links[i])}
  }
  function update(){
    ticking=false;
    if(!rail.offsetParent)return;               /* rail hidden at this width */
    var best=0;
    for(var i=0;i<hs.length;i++){
      if(hs[i].getBoundingClientRect().top<=140)best=i;else break;
    }
    var doc=document.documentElement;
    if(window.pageYOffset+window.innerHeight>=doc.scrollHeight-4)best=hs.length-1;
    setActive(best);
  }
  var ticking=false;
  function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(update)}}
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  links.forEach(function(a,i){a.addEventListener('click',function(){setActive(i)})});
  update();
})();
</script>
<script src="mermaid.min.js"></script>
<script>
(function(){
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var light = {
    primaryColor:'#D4E1F5', primaryBorderColor:'#7EA6E0', primaryTextColor:'#1F1E1D',
    secondaryColor:'#EDF5F0', secondaryBorderColor:'#2E7D5B', secondaryTextColor:'#1F1E1D',
    tertiaryColor:'#F8F1E4', tertiaryBorderColor:'#A3652A',
    lineColor:'#0B4D6A', edgeLabelBackground:'#FAF9F5',
    fontFamily:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif', fontSize:'14px',
    clusterBkg:'#F5F3EC', clusterBorder:'#E3E0D7'
  };
  var darkv = {
    primaryColor:'#1E2331', primaryBorderColor:'#93A8D8', primaryTextColor:'#E8E5DE',
    secondaryColor:'#1C2A24', secondaryBorderColor:'#7FC8A9', secondaryTextColor:'#E8E5DE',
    tertiaryColor:'#2C2418', tertiaryBorderColor:'#DBA968',
    lineColor:'#93A8D8', edgeLabelBackground:'#191817',
    fontFamily:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif', fontSize:'14px',
    clusterBkg:'#211F1D', clusterBorder:'#3A3630'
  };
  mermaid.initialize({startOnLoad:true, theme:'base', themeVariables: dark?darkv:light,
    flowchart:{useMaxWidth:true, curve:'linear', nodeSpacing:40, rankSpacing:55},
    securityLevel:'loose'});
})();
</script>
</body>
</html>
