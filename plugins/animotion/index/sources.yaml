    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 3, flat: 0, line: 0, hand: 0, iso: 0, wire: 1 }
    consult_when: [pixel-idiom, blocky-idiom, props]
    extract: "1,036 free icons on a strict 24 px pixel grid, no anti-aliasing, pure <path>, currentColor. Scale only by whole multiples (24/48/72/96); add shape-rendering=crispEdges."
    urls: { home: "https://github.com/halfmage/pixelarticons", machine: "https://cdn.jsdelivr.net/npm/pixelarticons@{version}/svg/{name}.svg", license: "https://github.com/halfmage/pixelarticons/blob/master/LICENSE" }
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix pixelarticons", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/halfmage/pixelarticons/blob/master/LICENSE", embed: "yes", attribution: notice, modify: allowed, conditions: "free subset only; Pro icons (5,497 total) are paid" }
