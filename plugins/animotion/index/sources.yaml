  # ───────────────────────── Published illustration guidelines ─────────────────────────

  - id: ibm-illustration
    name: IBM Design Language, illustration
    kind: guideline
    use: consult
    idioms: { pixel: 0, flat: 3, line: 3, hand: 0, iso: 3, wire: 3 }
    consult_when: [defining-spec, flat-idiom, line-idiom, iso-idiom, wire-idiom, people, greeking]
    extract: >-
      The most concrete published spec. Line: 4 px grid, <=4 line weights.
      Flat: 8 px grid, shapes and gaps >=8 px, 8 px overlap. All: angles in
      15-degree steps, curves from circle segments, opaque shapes, no blend
      modes. Isometric: triangle grid, one light source, one shadow type.
      People: eight heads high, neutral expressions. Hybrid UI: fidelity
      high/mid/low; greek bar = x-height, gap 1.5x bar; spacers 8/16/32/48;
      pictograms 48 px in 72 px squares or 84 px circles.
    urls:
      home: https://www.ibm.com/design/language/illustration/overview
      machine: https://github.com/carbon-design-system/design-language-website/tree/master/src/pages/illustration
      flat: https://www.ibm.com/design/language/illustration/flat-style/design
      line: https://www.ibm.com/design/language/illustration/line-style/design/
