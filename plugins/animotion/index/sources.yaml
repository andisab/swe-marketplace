    license: { name: facts-only, url: "https://developer.apple.com/design/human-interface-guidelines/motion", embed: n/a, attribution: none, modify: n/a, conditions: "" }
    traps:
      - "The WWDC page's copy-code block renders the damping parentheses ambiguously; the form above gives critical damping at bounce 0."
      - "unconfirmed: numeric .smooth/.snappy/.bouncy presets (third parties say 0.5/0, 0.5/0.15, 0.5/0.3)."
    last_verified: 2026-11-11
    cadence: yearly

