  # ───────────────────────── Motion guidance ─────────────────────────

  - id: emil-kowalski
    name: Emil Kowalski skills and articles
    kind: motion-guidance
    use: consult
    idioms: any
    consult_when: [choreography, choosing-easing, choosing-springs, reduced-motion, motion-spec]
    extract: >-
      The most directly reusable guidance. choreograph skill: cast lead,
      support, decoration, static; together/overlap/sequence/carry; product
      stagger 30-80 ms (total under ~300 ms), hero stagger 100-150 ms on
      0.5-0.6 s entrances; 'Uniform stagger is forbidden'; exits simultaneous and
      shorter; reduced motion collapses the choreography. animate skill: UI
      ease-out 0.23,1,0.32,1; on-screen 0.77,0,0.175,1; drawer 0.32,0.72,0,1;
      never ease-in on UI; spring {0.5 s, bounce 0.2}, bounce 0.1-0.3. Never
      from scale(0): start at 0.9-0.97; press at 0.97; 2 px blur on a crossfade.
    urls:
      home: https://github.com/emilkowalski/skills
      choreograph: https://github.com/emilkowalski/skills/blob/main/skills/choreograph/SKILL.md
      animate: https://github.com/emilkowalski/skills/blob/main/skills/animate/SKILL.md
      tips: https://emilkowal.ski/ui/7-practical-animation-tips
      great: https://emilkowal.ski/ui/great-animations
      when_not: https://emilkowal.ski/ui/you-dont-need-animations
      course: https://animations.dev/
    access: { method: web, auth: none, recipe: "read SKILL.md files raw from GitHub", rate_limit: n/a }
    license: { spdx: MIT, url: "https://github.com/emilkowalski/skills", embed: n/a, attribution: notice, modify: allowed, conditions: "skills repo MIT (about 56k stars): animotion may adapt text with attribution; articles are facts only; animations.dev is a paid course" }
