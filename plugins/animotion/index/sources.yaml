  - id: dicebear
    name: DiceBear (character and avatar API)
    kind: hub
    use: fetch-embed
    idioms: { pixel: 3, flat: 3, line: 2, hand: 2, iso: 0, wire: 0 }
    consult_when: [characters, avatars, character-schema]
    extract: >-
      61 styles (42 CC0, 14 CC BY 4.0, 1 MIT, 4 artist's own terms). Each style
      is a base plus named parts at anchors, each with variants and a colour
      option; output keeps every part as <g id="<slot>-<variant>-<hash>"> placed
      by <use transform>, so parts animate one at a time. Same seed, same figure
      in every core. The model for animotion's character schema.
    urls:
      home: https://www.dicebear.com
      machine: https://api.dicebear.com/10.x
      docs: https://www.dicebear.com/how-to-use/http-api/
      llms: https://www.dicebear.com/llms.txt
      license: https://www.dicebear.com/licenses/
      repo: https://github.com/dicebear/dicebear
    access:
      method: rest
      auth: none
      recipe: |
        styles:     GET https://api.dicebear.com/10.x
        svg:        GET https://api.dicebear.com/10.x/{style}/svg?seed={seed}&{slot}Variant={v}
        json:       GET https://api.dicebear.com/10.x/{style}/json?seed={seed}
        slots:      GET https://api.dicebear.com/10.x/{style}/options.json
        definition: GET https://api.dicebear.com/10.x/{style}/definition.json
      rate_limit: "SVG 50 requests/s; self-hostable; JS/PHP/Python/Rust/Go/Dart/C# cores give byte-identical output"
    license:
      name: per style (code MIT)
      url: https://www.dicebear.com/licenses/
      embed: conditional
      attribution: per-set
      modify: allowed
      conditions: "CC0 styles: none. CC BY 4.0 styles: credit author, licence link and changes. Artist-terms styles: read the style's licence. Licence and author ship as RDF <metadata> inside each SVG; keep it."
    animation: { draw_on: false, separable_parts: true }
    traps:
      - "unconfirmed: llms.txt marks some styles as animated; not examined yet."
    last_verified: 2026-11-11
