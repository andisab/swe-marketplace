# animotion source index
#
# Pointers to ONLINE sources that Claude consults or fetches from at authoring
# time. Nothing is mirrored: this repo and the local disk hold no copy of any
# library. Claude fetches only what one scene needs, embeds it in that deck
# (an offline single file), and writes the item into the deck's credits block.
#
# Every entry declares one of three uses:
#   fetch-embed  Claude may fetch items at authoring time and embed them in a
#                deliverable, under the entry's licence block.
#   consult      read for rules or numbers (tokens, guidelines, techniques);
#                nothing from it is embedded.
#   study-only   look at for ideas or style, or as evidence for deriving a
#                visual language; never a source of assets. A study-only entry
#                with access.method user-supplied and license.embed yes or
#                conditional may be embedded only when the user downloads the
#                file and hands it over (the user then holds the licence).
#
# Fields (merged schema, research note sources-and-derivation.md §1.2):
#   id, name, kind, use, idioms, consult_when, extract, urls, access, license,
#   [style], [animation], [motion], [tool], [exclude], [auto_select], traps,
#   last_verified, cadence
#   kind      hub | icon-set | emoji | logos | illustration | character |
#             palette | game-assets | animation-assets | component-gallery |
#             motion-tokens | easing-tool | motion-guidance | guideline |
#             tutorial | exemplar | style-board | extraction-tool | token-format
#   idioms    0-3 fit for pixel, flat, line, hand, iso, wire; `any` when the
#             source is idiom-agnostic (motion, tools, mood boards)
#   access.method  iconify | npm-cdn | gh-cdn | rest | graphql | registry |
#                  mcp | zip | web | user-supplied | none
#   access.auth    none | api-key | oauth | paid
#   license.embed        yes | conditional | no | n/a
#   license.attribution  none | notice (HTML comment) | visible |
#                        per-item-author | per-set | n/a
#   license.modify       allowed | share-alike | not-allowed | n/a
#   auto_select    false = never pick automatically; only on explicit request
#   traps     strings; a trap starting "unconfirmed:" is a fact the research
#             could not confirm and must be checked before relying on it
#   cadence   monthly | quarterly | yearly (manual re-check; see MAINTAINING.md)
#
# In recipes, `{version}` means a pinned x.y.z (resolve with
# `npm view <pkg> version`), never @latest, so a re-fetch is reproducible.
# Sources: reports/sources-icons.md, sources-illustration.md,
# sources-motion.md, derivation-pipeline.md (2026-11-11).

schema: 1
updated: 2026-11-11

sources:

  # ───────────────────────── Icons: hub ─────────────────────────

  - id: iconify
    name: Iconify (API hub for open icon sets)
    kind: hub
    use: fetch-embed
    idioms: { pixel: 3, flat: 3, line: 3, hand: 2, iso: 0, wire: 3 }
    consult_when: [any-icon, icon-search, set-licence-lookup]
    extract: >-
      Search here first (276 sets, 467,286 icons incl. variants on 2026-11-11).
      Read each set's licence from its info record, batch-fetch bodies, and
      fetch the set's original file when parts must animate separately.
    urls:
      home: https://iconify.design
      machine: https://api.iconify.design
      docs: https://iconify.design/docs/api/
      search_docs: https://iconify.design/docs/api/search.html
      svg_docs: https://iconify.design/docs/api/svg.html
      metadata_mirror: https://cdn.jsdelivr.net/npm/@iconify/collections/collections.json
    access:
      method: iconify
      auth: none
      recipe: |
        search:    GET https://api.iconify.design/search?query={q}&limit=32&prefixes=lucide,tabler,ph
                   (limit min 32, default 64, max 999; also prefix, start, category;
                    query keywords style=stroke|fill, palette=true|false, prefix:{p})
        one SVG:   GET https://api.iconify.design/{prefix}/{name}.svg?height=24&color=%23d97757
        batch:     GET https://api.iconify.design/{prefix}.json?icons={a},{b},{c}
        set info:  GET https://api.iconify.design/collection?prefix={prefix}&info=true
        all sets:  GET https://api.iconify.design/collections   (cache for the session)
        names:     GET https://api.iconify.design/keywords?prefix={stem}
        no-API metadata: "https://cdn.jsdelivr.net/npm/@iconify-json/{prefix"}/info.json
                         https://cdn.jsdelivr.net/npm/@iconify-json/{prefix}/icons.json (whole set)
      rate_limit: >-
        Undocumented. About 25 calls in a few minutes returned HTTP 429
        (Cloudflare 1015, retry-after 3596 s) for an hour. Search on the API,
        fetch icons in batches, read set metadata from jsDelivr.
    license:
      name: per set (Iconify's own MIT does not cover the icons)
      url: https://iconify.design/docs/icons/icon-set-basics.html
      embed: conditional
      attribution: per-set
      modify: allowed
      conditions: >-
        All icons in a set share one licence; apply that set's entry here, or
        the set's info.license when it has no entry. Mix on 2026-11-11: 144
        MIT, 53 CC-BY-4.0, 31 Apache-2.0, 13 OFL-1.1, 10 CC0, 7 CC-BY-SA-4.0,
        4 ISC, 6 GPL variants, 1 CC-BY-NC-SA-4.0, 1 CC-BY-NC-4.0.
    exclude:
      spdx: [CC-BY-SA-*, GPL-*, "*-NC-*"]
      prefixes: [openmoji, cbi, ps, dashicons, gridicons, icomoon-free, et, gala,
                 wordpress, typcn, arcticons, "entypo*", si-glyph, brandico,
                 fontelico, emojione-v1]
    animation: { draw_on: depends-on-set, separable_parts: false }
    traps:
      - "Output is optimised: separate parts are merged into one path (Lucide bot: 6 elements in source, 3 from Iconify)."
      - "SVG output carries no licence comment; build the credit from the set's info record."
      - "Iconify's SPDX field can lag upstream (Remix Icon, Health Icons); trust the upstream licence URL in the set's own entry."
      - "unconfirmed: the exact rate limit; ~25 requests is one observation, not a published number."
    last_verified: 2026-11-11
    cadence: monthly

  # ───────────────────────── Icons: line and UI ─────────────────────────

  - id: lucide
    name: Lucide
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 1, line: 3, hand: 0, iso: 0, wire: 3 }
    consult_when: [line-idiom, wire-idiom, ui-chrome, state-badges]
    extract: "2,046 icons; 24 px grid, 2 px stroke, round caps and joins, rx=2 rects, 1 px padding. Fetch the source SVG for separable parts."
    urls:
      home: https://lucide.dev
      machine: "https://cdn.jsdelivr.net/npm/lucide-static@{version}/icons/{name}.svg"
      metadata: "https://cdn.jsdelivr.net/npm/lucide-static@{version}/tags.json"
      docs: https://github.com/lucide-icons/lucide/blob/main/docs/contribute/icons/design-principles.md
      design_guide: https://lucide.dev/guide/design/icon-design-guide
    access:
      method: npm-cdn
      auth: none
      recipe: "Iconify prefix lucide for search; source SVG from lucide-static (pinned_version 1.72.0 on 2026-11-11)."
      rate_limit: none known (jsDelivr)
    license:
      spdx: ISC
      url: https://github.com/lucide-icons/lucide/blob/main/LICENSE
      embed: "yes"
      attribution: notice
      modify: allowed
      conditions: "Feather-derived icons are MIT (listed in the LICENSE file)."
    style: { render: stroke, grid: 24, stroke_width: 2, caps_joins: round, corner_radius: 2 }
    animation: { draw_on: true, separable_parts: true, notes: "rects carry rx, so radius can be re-tokened" }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: tabler
    name: Tabler Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 3, hand: 0, iso: 0, wire: 3 }
    consult_when: [line-idiom, wire-idiom, ui-chrome]
    extract: "6,287 icons (5,233 outline, 1,054 filled); same 2 px / 24 grid as Lucide, so the two mix."
    urls:
      home: https://github.com/tabler/tabler-icons
      machine: "https://cdn.jsdelivr.net/npm/@tabler/icons@{version}/icons/{outline|filled}/{name}.svg"
      metadata: "https://cdn.jsdelivr.net/npm/@tabler/icons@{version}/icons.json"
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix tabler; icons.json has tags and categories", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/tabler/tabler-icons", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: stroke, grid: 24, stroke_width: 2, caps_joins: round }
    animation: { draw_on: true, separable_parts: true }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: iconoir
    name: Iconoir
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 0, line: 3, hand: 0, iso: 0, wire: 2 }
    consult_when: [line-idiom]
    extract: "1,671 icons; stroke 1.5 on a 24 grid."
    urls: { home: "https://api.iconify.design/collection?prefix=iconoir&info=true", machine: "https://cdn.jsdelivr.net/npm/iconoir@{version}/icons/regular/{name}.svg" }
    access: { method: iconify, auth: none, recipe: "Iconify prefix iconoir", rate_limit: see iconify }
    license: { spdx: MIT, url: "https://api.iconify.design/collection?prefix=iconoir&info=true", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: stroke, grid: 24, stroke_width: 1.5 }
    animation: { draw_on: true, separable_parts: true }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: hugeicons
    name: Hugeicons (free set)
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 0, line: 3, hand: 0, iso: 0, wire: 2 }
    consult_when: [line-idiom]
    extract: "6,065 free icons; stroke 1.5 on a 24 grid."
    urls: { home: "https://api.iconify.design/collection?prefix=hugeicons&info=true" }
    access: { method: iconify, auth: none, recipe: "Iconify prefix hugeicons", rate_limit: see iconify }
    license: { spdx: MIT, url: "https://api.iconify.design/collection?prefix=hugeicons&info=true", embed: "yes", attribution: notice, modify: allowed, conditions: "free set only" }
    style: { render: stroke, grid: 24, stroke_width: 1.5 }
    animation: { draw_on: true, separable_parts: true }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: heroicons
    name: Heroicons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 2, hand: 0, iso: 0, wire: 3 }
    consult_when: [wire-idiom, ui-chrome, dense-ui]
    extract: "1,288 icons; 24 outline (stroke 1.5); solid at 24, 20 (mini) and 16 (micro) for dense UI."
    urls:
      home: https://github.com/tailwindlabs/heroicons
      machine: "https://cdn.jsdelivr.net/npm/heroicons@{version}/{24/outline|24/solid|20/solid|16/solid}/{name}.svg"
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix heroicons for search", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/tailwindlabs/heroicons", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: stroke-and-fill, grid: [24, 20, 16], stroke_width: 1.5 }
    animation: { draw_on: outline-only, separable_parts: partial }
    traps: ["Closed to new icons; the set will not grow."]
    last_verified: 2026-11-11
    cadence: quarterly

  - id: feather
    name: Feather
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 0, line: 2, hand: 0, iso: 0, wire: 2 }
    consult_when: [legacy-feather-match]
    extract: "286 icons, stroke 2, 24 grid, round. Use only to match legacy work; Lucide is its maintained successor."
    urls: { home: "https://github.com/feathericons/feather", machine: "https://cdn.jsdelivr.net/npm/feather-icons@{version}/dist/icons/{name}.svg" }
    access: { method: npm-cdn, auth: none, recipe: "", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/feathericons/feather", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: stroke, grid: 24, stroke_width: 2, caps_joins: round }
    animation: { draw_on: true, separable_parts: true }
    traps: ["Dormant: last push 2025-03-11."]
    last_verified: 2026-11-11
    cadence: yearly

  - id: bootstrap-icons
    name: Bootstrap Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 0, hand: 0, iso: 0, wire: 3 }
    consult_when: [wire-idiom, ui-chrome]
    extract: "2,078 icons; fill on a 16 grid."
    urls: { home: "https://github.com/twbs/icons", machine: "https://cdn.jsdelivr.net/npm/bootstrap-icons@{version}/icons/{name}.svg" }
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix bi", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/twbs/icons", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: fill, grid: 16 }
    animation: { draw_on: false, separable_parts: false }
    traps: ["16 grid: don't mix with 24-grid sets in one scene (looks collected, not designed)."]
    last_verified: 2026-11-11
    cadence: quarterly

  - id: fluent-system-icons
    name: Fluent UI System Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 0, hand: 0, iso: 0, wire: 3 }
    consult_when: [wire-idiom, microsoft-native-look]
    extract: "19,945 files (sizes x styles); outlined fills, 16-48 sizes, soft corners."
    urls: { home: "https://github.com/microsoft/fluentui-system-icons", machine: "https://cdn.jsdelivr.net/npm/@fluentui/svg-icons@{version}/icons/{name}_{size}_{regular|filled}.svg" }
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix fluent", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/microsoft/fluentui-system-icons", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: fill-outline, grid: [16, 20, 24, 28, 32, 48] }
    animation: { draw_on: false, separable_parts: false }
    traps: ["Fill-outlined: a draw-on traces the outline and looks wrong; use a clip-path wipe or scale-in."]
    last_verified: 2026-11-11
    cadence: quarterly

  # ───────────────────────── Icons: fill and flat ─────────────────────────

  - id: phosphor
    name: Phosphor Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 3, line: 2, hand: 0, iso: 0, wire: 2 }
    consult_when: [flat-idiom, objects]
    extract: "About 1,500 icons x 6 weights (thin, light, regular, bold, fill, duotone; 9,072 variants). Pick the weight that matches the spec; fills can't change stroke."
    urls: { home: "https://github.com/phosphor-icons/core", machine: "https://cdn.jsdelivr.net/npm/@phosphor-icons/core@{version}/assets/{weight}/{name}[-{weight}].svg" }
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix ph", rate_limit: none known }
    license: { spdx: MIT, url: "https://github.com/phosphor-icons/core", embed: "yes", attribution: notice, modify: allowed, conditions: "" }
    style: { render: fill-outline, grid: 256, variants: [thin, light, regular, bold, fill, duotone] }
    animation: { draw_on: false, separable_parts: few }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: material-symbols
    name: Material Symbols
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 3, line: 2, hand: 0, iso: 0, wire: 3 }
    consult_when: [flat-idiom, wire-idiom, material-brand]
    extract: "15,777 in Iconify (variants). viewBox 0 -960 960 960; axes FILL 0-1, wght 100-700, GRAD, opsz 20-48. Outlined, rounded or sharp to match the brand radius."
    urls:
      home: https://developers.google.com/fonts/docs/material_symbols
      machine: "https://fonts.gstatic.com/s/i/short-term/release/materialsymbols{outlined|rounded|sharp}/{name}/{default|wght300fill1}/24px.svg"
      docs: https://developers.google.com/fonts/docs/material_icons
    access: { method: rest, auth: none, recipe: "gstatic URL above (verified with smart_toy); Iconify prefix material-symbols for search", rate_limit: none known }
    license: { spdx: Apache-2.0, url: "https://developers.google.com/fonts/docs/material_icons", embed: "yes", attribution: notice, modify: allowed, conditions: "On-screen credit 'not required'; keep a licence reference and a modified note in a source comment." }
    style: { render: fill-outline, grid: 24, variants: [outlined, rounded, sharp] }
    animation: { draw_on: false, separable_parts: false }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: remix-icon
    name: Remix Icon
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 3, line: 1, hand: 0, iso: 0, wire: 2 }
    consult_when: [flat-idiom]
    extract: "3,188 icons; fill on a 24 grid in line/fill pairs."
    urls:
      home: https://github.com/Remix-Design/RemixIcon
      machine: "https://cdn.jsdelivr.net/npm/remixicon@{version}/icons/{Category}/{name}-{line|fill}.svg"
      license: https://github.com/Remix-Design/RemixIcon/blob/master/License
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix ri", rate_limit: none known }
    license:
      name: Remix Icon License v1.0
      url: https://github.com/Remix-Design/RemixIcon/blob/master/License
      embed: "yes"
      attribution: none
      modify: allowed
      conditions: "Recolour, resize, restroke allowed (§2.2); no copyright notice needed in presentations (§5); never as a logo or brand mark (§3.3); no competing icon library."
    style: { render: fill, grid: 24, variants: [line, fill] }
    animation: { draw_on: false, separable_parts: false }
    traps:
      - "Licence changed in January 2026 from Apache-2.0 to the custom Remix Icon License v1.0; Iconify metadata still says Apache-2.0 (v4.8.0). Trust the upstream licence file."
    last_verified: 2026-11-11
    cadence: monthly

  - id: carbon-icons
    name: IBM Carbon Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 1, flat: 2, line: 0, hand: 0, iso: 0, wire: 3 }
    consult_when: [wire-idiom, square-brand, ibm-brand]
    extract: "2,644 icons; fill on a 32 grid; squared IBM geometry."
    urls: { home: "https://github.com/carbon-design-system/carbon/tree/main/packages/icons", machine: "https://cdn.jsdelivr.net/npm/@carbon/icons@{version}/svg/32/{name}.svg" }
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix carbon", rate_limit: none known }
    license: { spdx: Apache-2.0, url: "https://github.com/carbon-design-system/carbon", embed: "yes", attribution: notice, modify: allowed, conditions: "note modified files in the source comment" }
    style: { render: fill, grid: 32 }
    animation: { draw_on: false, separable_parts: false }
    traps: []
    last_verified: 2026-11-11
    cadence: quarterly

  - id: font-awesome-free
    name: Font Awesome Free
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 0, hand: 0, iso: 0, wire: 2 }
    consult_when: [flat-idiom, user-asks-font-awesome]
    extract: "v7: 2,000 solid, 272 regular, plus brands; fill, varying widths."
    urls:
      home: https://fontawesome.com
      machine: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{version}/svgs/{solid|regular|brands}/{name}.svg"
      license: https://github.com/FortAwesome/Font-Awesome/blob/7.x/LICENSE.txt
      license_page: https://fontawesome.com/license/free
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix fa7-solid", rate_limit: none known }
    license: { spdx: CC-BY-4.0, url: "https://github.com/FortAwesome/Font-Awesome/blob/7.x/LICENSE.txt", embed: conditional, attribution: visible, modify: allowed, conditions: "SVGs CC BY 4.0 (fonts OFL, code MIT). Keep the in-file comment or add a visible credit; say 'modified'." }
    style: { render: fill, grid: varies }
    animation: { draw_on: false, separable_parts: false }
    traps:
      - "Each file's `<!--! Font Awesome Free ... License ... -->` comment is the attribution, and SVGO and Iconify strip it: re-add the credit."
      - "unconfirmed: whether the terse in-file comment fully satisfies CC BY 4.0's licence-link requirement (debated); a visible credit removes the doubt."
    last_verified: 2026-11-11
    cadence: quarterly

  - id: health-icons
    name: Health Icons
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 2, hand: 0, iso: 0, wire: 0 }
    consult_when: [people, medical, healthcare-deck]
    extract: "2,128 icons; 48 grid outline and filled; people and medical objects."
    urls:
      home: https://github.com/resolvetosavelives/healthicons
      machine: "https://cdn.jsdelivr.net/npm/healthicons@{version}/public/icons/svg/{outline|filled}/{category}/{name}.svg"
      license: https://github.com/resolvetosavelives/healthicons/blob/main/LICENSE
    access: { method: npm-cdn, auth: none, recipe: "Iconify prefix healthicons", rate_limit: none known }
    license: { spdx: CC0-1.0, url: "https://github.com/resolvetosavelives/healthicons/blob/main/LICENSE", embed: "yes", attribution: none, modify: allowed, conditions: "" }
    style: { render: stroke-and-fill, grid: 48 }
    animation: { draw_on: outline-only, separable_parts: partial }
    traps: ["Repo says CC0; Iconify says MIT. Both permissive; record the upstream value."]
    last_verified: 2026-11-11
    cadence: quarterly

  - id: game-icons
    name: game-icons.net
    kind: icon-set
    use: fetch-embed
    idioms: { pixel: 0, flat: 2, line: 0, hand: 0, iso: 0, wire: 0 }
    consult_when: [flat-idiom, silhouettes]
    extract: "4,133 detailed fill silhouettes on a 512 grid."
    urls:
      home: https://game-icons.net
      machine: "https://cdn.jsdelivr.net/gh/game-icons/icons@master/{author}/{name}.svg"
      machine_alt: "https://raw.githubusercontent.com/game-icons/icons/master/{author}/{name}.svg"
      license: https://github.com/game-icons/icons/blob/master/license.txt
      faq: https://game-icons.net/faq.html
    access: { method: gh-cdn, auth: none, recipe: "Search with Iconify prefix game-icons, then resolve the author from the repo path {author}/{name}.svg (GitHub tree API), e.g. delapouite/robot-golem.svg", rate_limit: see iconify }
    license: { spdx: CC-BY-3.0, url: "https://github.com/game-icons/icons/blob/master/license.txt", embed: conditional, attribution: per-item-author, modify: allowed, conditions: "'Icons made by {author}' visible per author; a credits page is acceptable; a few authors are CC0." }
    style: { render: fill, grid: 512 }
    animation: { draw_on: false, separable_parts: false }
    traps:
      - "Iconify returns only the set-level author 'GameIcons', never the per-icon author the licence requires."
      - "Detailed silhouettes look heavy below 32 px; many authors, so consistency is uneven."
    last_verified: 2026-11-11
    cadence: quarterly

  # ───────────────────────── Icons: pixel and hand-drawn ─────────────────────────

