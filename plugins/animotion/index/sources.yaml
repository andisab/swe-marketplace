  - id: apple-motion
    name: Apple HIG motion and SwiftUI springs
    kind: motion-tokens
    use: consult
    idioms: any
    consult_when: [motion-spec, choosing-springs, reduced-motion]
    extract: >-
      No duration scale. Rules: add motion purposefully, make it optional, keep
      feedback brief and precise, let people cancel; avoid sustained oscillation
      near 0.2 Hz (visionOS). Springs as perceptual duration + bounce: ~15%
      'doesn't feel very bouncy', ~30% noticeable. Conversion: mass 1,
      stiffness (2 pi / d)^2, damping (1 - bounce) x 4 pi / d.
    urls:
      home: https://developer.apple.com/design/human-interface-guidelines/motion
      machine: https://developer.apple.com/tutorials/data/design/human-interface-guidelines/motion.json
      springs: https://developer.apple.com/videos/play/wwdc2023/10158/
      swiftui: https://developer.apple.com/documentation/swiftui/animation
